<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Matching Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">PS09 · Memory Game</p>
      <h1>Memory Matching Game</h1>
      <p class="intro">Find all eight matching pairs on the board. Choose two cards at a time and try to remember their positions.</p>
    </header>
    <section class="stats" aria-label="Game statistics">
      <div><span>Moves</span><strong id="moves-value">0</strong></div>
      <div><span>Pairs</span><strong id="pairs-value">0 / 8</strong></div>
      <div><span>Time</span><strong id="time-value">00:00</strong></div>
    </section>
    <section class="panel">
      <div id="board" class="board" aria-label="Memory card board"></div>
      <p id="message" class="message" role="status">Select any card to begin.</p>
      <div class="actions"><button id="restart-button" class="primary">Restart game</button></div>
    </section>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
